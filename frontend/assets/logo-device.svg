<!-- Surrey Opticians device: S and O in the practice's own letterforms.

     The letters are lifted from the wordmark on page 1 of the Surrey Opticians
     Brand Book 2026, so they are exactly the practice's Gill Sans Nova. The
     SETTING is not: their own SO device is a placed image in the brand book
     rather than vector artwork in the page, so it could not be lifted with the
     type. This is their two letters set plainly, standing in for it — near, but
     not a copy of the device itself.

     Replace it with the real thing by passing their artwork to
     scripts/install-logo.mjs as the device file.

     Turquoise #009DB1 is the brand's own value, from the Surrey Opticians Lookbook. -->
