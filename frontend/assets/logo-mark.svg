<!-- Surrey Opticians SO monogram — a trace of the practice's own
     Surrey Opticians Logo-01.png, drawn as bezier curves so the S flows as one
     continuous stroke rather than stacked arcs.

     The S begins outside the viewBox so its upper terminal is cut flush by the
     tile's left border, as the practice's mark is, and its lower bowl closes
     back under itself. Turquoise #009DB1 is the brand's own value, from the
     Surrey Opticians Lookbook.

     These same paths are drawn in src/ui/LogoMark.tsx (react-native-svg) and
     scripts/brand-assets.html, from which the PNGs are rendered — keep all
     three in step, or replace them with the practice's artwork. -->
<svg width="1032" height="400" viewBox="0 0 1032 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1032" height="400" fill="#009DB1"/>
  <circle cx="356" cy="162" r="142" fill="none" stroke="#fff" stroke-width="32"/>
  <path d="M -14 122 C 34 62 118 44 158 92 C 190 130 170 168 138 186 C 96 208 84 258 112 292 C 142 328 208 326 228 288 C 246 254 222 214 184 202" fill="none" stroke="#fff" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
