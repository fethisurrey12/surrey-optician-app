<!-- Surrey Opticians SO monogram — a trace of the practice's own
     Surrey Opticians Logo-01.png, drawn as bezier curves so the S flows as one
     continuous stroke. Turquoise #009DB1 is the brand's own value, from the
     Surrey Opticians Lookbook. The app renders these same paths through
     react-native-svg (src/ui/LogoMark.tsx); the PNGs under assets/images are
     rendered from this file for the store icon and splash. -->
<svg width="1032" height="400" viewBox="0 0 1032 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1032" height="400" fill="#009DB1"/>
  <circle cx="368" cy="150" r="152" fill="none" stroke="#fff" stroke-width="40"/>
  <path d="M 221 113
           C 221 76 188 56 152 56
           C 109 56 76 83 76 124
           C 76 162 111 183 161 196
           C 214 209 249 233 249 275
           C 249 319 207 344 163 344
           C 117 344 76 321 65 282"
        fill="none" stroke="#fff" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
